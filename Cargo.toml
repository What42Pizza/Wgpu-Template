[package]
name = "wgpu-template"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
smol = "2.0.2"
bytemuck = { version = "1.25.0", features = ["derive"] }
env_logger = "0.11.10"
glam = "0.33.0"
image = "0.25.10"
intel_tex_2 = "0.5.0"
lazy_static = "1.5.0"
log = "0.4.30"
rayon = "1.12.0"
serde = "1.0.228"
serde-hjson = "1.1.0"
tobj = "4.0.3"
wgpu = "29.0.3"
winit = "0.30.13"



[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
#lto = true
#codegen-units = 1
#incremental = false
#debug = false
debug = true # for flamegraph
